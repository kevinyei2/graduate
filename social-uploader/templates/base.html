<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}多平台上傳{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  {% block head %}{% endblock %}
</head>
<body>
  <header class="top">
    <a class="brand" href="{{ url_for('index') }}">多平台上傳</a>
    <nav>
      <a href="{{ url_for('new_post') }}" class="{{ 'on' if request.endpoint == 'new_post' }}">＋ 新增貼文</a>
      <a href="{{ url_for('index') }}" class="{{ 'on' if request.endpoint == 'index' }}">佇列</a>
      <a href="{{ url_for('settings_page') }}" class="{{ 'on' if request.endpoint == 'settings_page' }}">設定</a>
    </nav>
  </header>
  <main>
    {% with msgs = get_flashed_messages(with_categories=true) %}
      {% for cat, m in msgs %}<div class="flash {{ cat }}">{{ m }}</div>{% endfor %}
    {% endwith %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
